[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rocgraph"
version = "0.0.1"
description = "Capture-safe HIP/CUDA graph pieces for launch-bound recurrent training on AMD ROCm"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "PolyForm-Noncommercial-1.0.0" }
dependencies = [
    "torch>=2.0",
    "numpy",
    "scipy",
]

[tool.setuptools.packages.find]
where = ["src"]
